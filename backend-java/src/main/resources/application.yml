# Base config. Secrets come from environment variables only.
# Local development uses the `dev` profile (application-dev.yml), which is the
# default when SPRING_PROFILES_ACTIVE is not set. Any real deployment must set
# SPRING_PROFILES_ACTIVE (e.g. prod) plus the variables below.
#
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#   JWT_SECRET            at least 32 characters
#   JWT_EXPIRATION_MS     optional, default 24h
#   CORS_ALLOWED_ORIGINS  comma-separated, e.g. https://neurolearn.example.com
#   AI_PROVIDER           fake (default, offline) | gemini
#   GEMINI_API_KEY        required when AI_PROVIDER=gemini
#   GEMINI_MODEL          optional, default gemini-3.8-flash

server:
  port: 8080

spring:
  application:
    name: backend-java
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ai:
    provider: ${AI_PROVIDER:fake}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    # Max questions a teacher can generate per rolling 24 h (cost/abuse guard).
    daily-generation-limit: ${AI_DAILY_GENERATION_LIMIT:40}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
