# Base config. Secrets come from environment variables only.
# Local development uses the `dev` profile (application-dev.yml), which is the
# default when SPRING_PROFILES_ACTIVE is not set. Any real deployment must set
# SPRING_PROFILES_ACTIVE (e.g. prod) plus the variables below.
#
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#   JWT_SECRET            at least 32 characters
#   JWT_EXPIRATION_MS     optional, default 24h
#   CORS_ALLOWED_ORIGINS  comma-separated, e.g. https://neurolearn.example.com

server:
  port: 8080

spring:
  application:
    name: backend-java
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
